<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Rascunho offline | Controle de Gastos</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8f7;
        color: #17201d;
      }
      @media (prefers-color-scheme: dark) {
        :root { background: #0b1115; color: #f3f7f5; }
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 20px; }
      main { width: min(100%, 560px); margin: 24px auto; }
      .card {
        border: 1px solid rgba(100,116,139,.28);
        border-radius: 24px;
        padding: 24px;
        background: color-mix(in srgb, Canvas 94%, transparent);
        box-shadow: 0 18px 50px rgba(15,23,42,.10);
      }
      .eyebrow { color: #2563eb; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 8px 0; font-size: clamp(28px,7vw,38px); line-height: 1.05; }
      p { color: GrayText; line-height: 1.55; }
      form { display: grid; gap: 16px; margin-top: 22px; }
      label, legend { font-size: 13px; font-weight: 750; }
      input, textarea {
        width: 100%;
        min-height: 46px;
        margin-top: 7px;
        border: 1px solid rgba(100,116,139,.38);
        border-radius: 12px;
        padding: 10px 12px;
        background: Canvas;
        color: CanvasText;
        font: inherit;
      }
      textarea { min-height: 92px; resize: vertical; }
      fieldset { margin: 0; border: 0; padding: 0; }
      .types { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
      .type {
        min-height: 46px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(100,116,139,.38);
        border-radius: 12px;
        padding: 0 12px;
      }
      .type input { width: auto; min-height: auto; margin: 0; }
      .notice {
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        background: color-mix(in srgb, CanvasText 6%, transparent);
        font-size: 14px;
      }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button, a.action {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 16px;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }
      button.primary { border: 0; background: #2563eb; color: white; }
      button.secondary, a.action { border: 1px solid rgba(100,116,139,.38); background: transparent; color: inherit; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      #status { min-height: 22px; margin: 0; font-size: 14px; }
      .danger { color: #dc2626; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <span class="eyebrow">Modo offline</span>
        <h1>Salvar rascunho de transação</h1>
        <p>
          Este rascunho fica somente neste dispositivo. Ele não altera saldo,
          não cria transação e não será enviado automaticamente.
        </p>

        <div class="notice">
          Conta e categoria serão escolhidas quando a conexão voltar, antes da
          confirmação final.
        </div>

        <form id="draft-form">
          <fieldset>
            <legend>Tipo</legend>
            <div class="types">
              <label class="type"><input type="radio" name="type" value="EXPENSE" checked /> Despesa</label>
              <label class="type"><input type="radio" name="type" value="INCOME" /> Receita</label>
            </div>
          </fieldset>

          <label>
            Valor
            <input id="amount" inputmode="decimal" placeholder="0,00" autocomplete="off" required />
          </label>

          <label>
            Data
            <input id="date" type="date" required />
          </label>

          <label>
            Descrição
            <textarea id="description" maxlength="255" placeholder="Ex.: Mercado" required></textarea>
          </label>

          <p id="status" role="status" aria-live="polite"></p>

          <div class="actions">
            <button id="discard" class="secondary" type="button">Descartar</button>
            <button id="save" class="primary" type="submit">Salvar rascunho</button>
          </div>
        </form>

        <a class="action" href="/transacoes/nova" style="margin-top:12px;width:100%">
          Tentar voltar ao app
        </a>
      </section>
    </main>

    <script>
      (() => {
        const OWNER_KEY = "controle-gastos:offline-draft-owner:v1";
        const DRAFT_PREFIX = "controle-gastos:offline-transaction-draft:v1:";
        const owner = localStorage.getItem(OWNER_KEY);
        const form = document.getElementById("draft-form");
        const status = document.getElementById("status");
        const saveButton = document.getElementById("save");
        const amountInput = document.getElementById("amount");
        const dateInput = document.getElementById("date");
        const descriptionInput = document.getElementById("description");
        const discardButton = document.getElementById("discard");

        const today = new Date();
        const localToday = [
          today.getFullYear(),
          String(today.getMonth() + 1).padStart(2, "0"),
          String(today.getDate()).padStart(2, "0"),
        ].join("-");
        dateInput.value = localToday;

        if (!owner) {
          saveButton.disabled = true;
          status.className = "danger";
          status.textContent =
            "Abra o app conectado e entre na sua conta ao menos uma vez antes de criar rascunhos offline.";
          return;
        }

        const key = DRAFT_PREFIX + owner;

        function parseAmountToCents(value) {
          const normalized = value.trim().replace(/\s/g, "").replace(",", ".");
          if (!/^\d+(?:\.\d{0,2})?$/.test(normalized)) return null;
          const cents = Math.round(Number(normalized) * 100);
          return Number.isSafeInteger(cents) && cents > 0 ? cents : null;
        }

        function formatCents(cents) {
          return (cents / 100).toFixed(2).replace(".", ",");
        }

        function loadExisting() {
          const raw = localStorage.getItem(key);
          if (!raw) return;

          try {
            const draft = JSON.parse(raw);
            if (draft.version !== 1 || draft.ownerUserId !== owner) return;
            amountInput.value = formatCents(draft.amount || 0);
            descriptionInput.value = draft.description || "";
            dateInput.value = [
              String(draft.year).padStart(4, "0"),
              String(draft.month).padStart(2, "0"),
              String(draft.day).padStart(2, "0"),
            ].join("-");
            const type = form.querySelector('input[name="type"][value="' + draft.type + '"]');
            if (type) type.checked = true;
            status.textContent = "Rascunho offline existente carregado.";
          } catch {
            localStorage.removeItem(key);
          }
        }

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const amount = parseAmountToCents(amountInput.value);
          const description = descriptionInput.value.trim();
          const dateValue = dateInput.value;
          const type = form.querySelector('input[name="type"]:checked')?.value;

          if (!amount || !description || !dateValue || !type) {
            status.className = "danger";
            status.textContent = "Preencha tipo, valor, data e descrição.";
            return;
          }

          const [year, month, day] = dateValue.split("-").map(Number);
          const existingRaw = localStorage.getItem(key);
          let existing = null;
          try { existing = existingRaw ? JSON.parse(existingRaw) : null; } catch {}

          const now = new Date().toISOString();
          const draft = {
            version: 1,
            id: existing?.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
            ownerUserId: owner,
            type,
            amount,
            description,
            year,
            month,
            day,
            createdAt: existing?.createdAt || now,
            updatedAt: now,
          };

          localStorage.setItem(key, JSON.stringify(draft));
          status.className = "";
          status.textContent =
            "Rascunho salvo. Ao reconectar, abra Nova transação para revisar e confirmar o envio.";
        });

        discardButton.addEventListener("click", () => {
          localStorage.removeItem(key);
          form.reset();
          dateInput.value = localToday;
          status.className = "";
          status.textContent = "Rascunho descartado deste dispositivo.";
        });

        loadExisting();
      })();
    </script>
  </body>
</html>
