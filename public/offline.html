<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Sem conexão | Controle de Gastos</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8f7;
        color: #17201d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0b1115;
          color: #f3f7f5;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 480px);
        border: 1px solid rgba(100, 116, 139, 0.28);
        border-radius: 24px;
        padding: 28px;
        background: color-mix(in srgb, Canvas 94%, transparent);
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      }

      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #2563eb;
        color: #fff;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: clamp(28px, 8vw, 38px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: GrayText;
        line-height: 1.6;
      }

      .note {
        margin-top: 18px;
        padding: 14px;
        border-radius: 14px;
        background: color-mix(in srgb, CanvasText 6%, transparent);
        font-size: 14px;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 22px;
        border-radius: 999px;
        padding: 0 18px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">CG</div>
      <h1>Você está offline</h1>
      <p>
        Não foi possível acessar a rede. Por segurança, dados financeiros e
        respostas da API não são armazenados para uso offline.
      </p>
      <p class="note">
        Quando a conexão voltar, tente novamente para continuar usando seus
        dados atualizados.
      </p>
      <a href="">Tentar novamente</a>
    </main>
  </body>
</html>
