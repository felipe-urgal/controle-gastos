      - "tests/e2e/pwa-offline.spec.mjs"
      - "tests/e2e/accounts-flow.spec.mjs"
      - "tests/e2e/categories-flow.spec.mjs"
      - "tests/e2e/monthly-planning-flow.spec.mjs"
      - "tests/e2e/monthly-closing-flow.spec.mjs"
      - "tests/e2e/merchants-flow.spec.mjs"
      - "tests/e2e/transaction-templates-flow.spec.mjs"
      - "tests/e2e/dashboard-follow-up.spec.mjs"
      - "tests/e2e/financial-comparison-flow.spec.mjs"
      - "tests/e2e/credit-card-flow.spec.mjs"
