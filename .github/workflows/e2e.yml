name: E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "prisma/**"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "prisma/**"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_gastos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_gastos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_e2e
      JWT_SECRET: e2e-ci-only-placeholder-secret-with-sufficient-length
      RESEND_API_KEY: re_e2e_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:5100
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Build production app
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm dlx @playwright/test@1.62.1 install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            playwright-report
            test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
