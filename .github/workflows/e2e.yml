      - "app/api/auth/mfa/**"
      - "app/lib/security/**"
      - "app/services/mfa-service.ts"
      - "app/lib/users/**"
      - "app/components/pages/category/**"
      - "app/hooks/accounts/**"
      - "app/hooks/categories/**"
      - "app/hooks/use-modal-focus.ts"
      - "app/lib/accounts/**"
      - "app/lib/categories/**"
      - "app/lib/category-limits/**"
      - "app/lib/dashboard/**"
      - "app/components/pages/dashboard/**"
      - "app/hooks/dashboard/**"
      - "app/lib/local-ai/**"
      - "app/lib/periodic-summary/**"
      - "app/lib/monthly-closing/**"
      - "app/components/pages/monthly-closing/**"
      - "app/api/monthly-closing/**"
      - "app/(pages)/(home)/fechamento/**"
      - "app/services/monthly-closing-service.ts"
      - "app/types/monthly-closing.ts"
      - "app/components/pages/merchant/**"
      - "app/components/pages/transaction-templates/**"
      - "app/api/transaction-templates/**"
      - "app/lib/templates/**"
      - "app/services/transaction-template-service.ts"
      - "app/types/transaction-template.ts"
      - "app/lib/merchants/**"
      - "app/api/merchant-aliases/**"
      - "app/api/merchants/**"
      - "app/(pages)/(home)/estabelecimentos/**"
      - "app/services/merchant-service.ts"
      - "app/services/merchant-alias-service.ts"
      - "app/types/merchant.ts"
      - "app/types/merchant-alias.ts"
      - "app/lib/financial-comparison/**"
      - "app/components/pages/financial-comparison/**"
      - "app/api/financial-comparison/**"
      - "app/(pages)/(home)/comparar/**"
      - "app/services/financial-comparison-service.ts"
      - "app/types/financial-comparison.ts"
      - "app/lib/cards/**"
      - "app/lib/transactions/reconciliation-*.ts"
      - "app/lib/recurrences/**"
      - "app/lib/subscriptions/**"
      - "app/lib/commitments/**"
      - "app/lib/calendar/**"
      - "app/lib/payroll/**"
      - "app/api/payroll/**"
      - "app/components/pages/payroll/**"
      - "app/(pages)/(home)/rendimentos-trabalho/**"
      - "app/components/pages/recurrences/**"
      - "app/components/pages/financial-commitments/**"
      - "app/components/pages/calendar/**"
      - "app/hooks/calendar/**"
      - "app/api/calendar/**"
      - "app/(pages)/(home)/calendario/**"
      - "app/services/recurrence-service.ts"
      - "app/services/subscription-service.ts"
      - "app/services/financial-commitments-service.ts"
      - "app/services/calendar-service.ts"
      - "app/services/account-service.ts"
      - "app/services/category-service.ts"
      - "app/services/category-limit-service.ts"
      - "app/services/credit-card-service.ts"
      - "app/services/reconciliation-service.ts"
      - "app/types/account.d.ts"
      - "app/types/category.d.ts"
      - "app/types/category-monthly-limit.ts"
      - "app/types/credit-card.ts"
      - "app/types/calendar.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "app/components/pwa/**"
      - "app/lib/pwa/**"
      - "public/sw.js"
      - "public/offline.html"
      - "public/offline-transacao.html"
      - "public/manifest.json"
      - "proxy.ts"
      - "next.config.ts"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_gastos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_gastos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_e2e
      JWT_SECRET: e2e-ci-only-placeholder-secret-with-sufficient-length
      TOTP_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
      RESEND_API_KEY: re_e2e_placeholder
      RESEND_FROM_EMAIL: no-reply@example.test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:5100
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5100
      TRUST_PROXY_HEADERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm test:e2e:deps

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Build production app
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --dir tests/e2e --ignore-workspace exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run PR E2E
        if: github.event_name == 'pull_request'
        run: >-
          pnpm test:e2e
          tests/e2e/pwa-offline.spec.mjs
          tests/e2e/accounts-flow.spec.mjs
          tests/e2e/categories-flow.spec.mjs
          tests/e2e/monthly-planning-flow.spec.mjs
          tests/e2e/monthly-closing-flow.spec.mjs
          tests/e2e/merchants-flow.spec.mjs
          tests/e2e/transaction-templates-flow.spec.mjs
          tests/e2e/dashboard-follow-up.spec.mjs
          tests/e2e/financial-comparison-flow.spec.mjs
          tests/e2e/credit-card-flow.spec.mjs
          tests/e2e/reconciliation-flow.spec.mjs
          tests/e2e/recurrences-flow.spec.mjs
          tests/e2e/commitments-flow.spec.mjs
          tests/e2e/calendar-flow.spec.mjs
          tests/e2e/payroll-flow.spec.mjs
          tests/e2e/user-password-reauth.spec.mjs
          tests/e2e/user-email-change.spec.mjs
          tests/e2e/user-profile-state.spec.mjs
          tests/e2e/user-profile-mobile.spec.mjs
          tests/e2e/user-delete-account.spec.mjs
          tests/e2e/mfa-flow.spec.mjs
          --project=${{ matrix.browser }}

      - name: Run full E2E
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
