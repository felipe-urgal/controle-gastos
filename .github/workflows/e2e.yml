name: E2E

on:
  workflow_dispatch:
  # Validação visual (specs *-visual) roda só após o merge na main, para não pesar nos PRs.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Push na main: só chromium (specs visuais) em 3 shards paralelos (o spec roda com workers: 1).
      # Manual: suíte completa, sem shards. Não roda em PR; o gate do PR é o CI (quality).
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"browser":"chromium","shard":"1/3"},{"browser":"chromium","shard":"2/3"},{"browser":"chromium","shard":"3/3"}]' || '[{"browser":"chromium","shard":""},{"browser":"firefox","shard":""},{"browser":"webkit","shard":""}]') }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_gastos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_gastos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_e2e
      JWT_SECRET: e2e-ci-only-placeholder-secret-with-sufficient-length
      TOTP_ENCRYPTION_KEY: "2222222222222222222222222222222222222222222222222222222222222222"
      RESEND_API_KEY: re_e2e_placeholder
      RESEND_FROM_EMAIL: no-reply@example.test
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:5100
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5100
      TRUST_PROXY_HEADERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tests/e2e/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm test:e2e:deps

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Build production app
        run: pnpm build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('tests/e2e/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --dir tests/e2e --ignore-workspace exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run visual validation (main)
        if: github.event_name == 'push'
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e tests/e2e/*-visual.spec.mjs --project=chromium --shard=$SHARD

      - name: Run full E2E
        if: github.event_name == 'workflow_dispatch'
        run: pnpm test:e2e --project=${{ matrix.browser }}

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.browser }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: |
            playwright-report
            test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
