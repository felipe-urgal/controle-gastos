name: Temporary scoped Next.js lockfile validation

on:
  push:
    branches:
      - security/next-security-update

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/database
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Reset lockfile and update only Next packages
        shell: bash
        run: |
          git checkout origin/main -- pnpm-lock.yaml
          pnpm update next@16.3.3 eslint-config-next@16.3.3 @next/bundle-analyzer@16.3.3 --lockfile-only

      - name: Commit scoped lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git commit -m "chore: scope lockfile update to Next.js packages"
          git push

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
