name: Prod Smoke

# Smoke read-only de produção: health, rotas públicas/protegidas e leituras
# autenticadas. Nenhuma escrita. Usa conta dedicada sem MFA (ver docs/OBSERVABILITY.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: read

concurrency:
  group: prod-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run production smoke
        env:
          PROD_SMOKE_BASE_URL: ${{ vars.PROD_SMOKE_BASE_URL }}
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: node scripts/prod-smoke.mjs
