name: Minimize lockfile repair

on:
  push:
    branches:
      - fix/repair-pnpm-lockfile

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/repair-pnpm-lockfile
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Restore main lockfile and remove duplicate mappings only
        run: |
          git fetch origin main
          git show origin/main:pnpm-lock.yaml > pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          lines = path.read_text().splitlines(keepends=True)
          sections = {'packages', 'snapshots'}
          current = None
          seen = {section: set() for section in sections}
          duplicates = []
          out = []
          i = 0

          while i < len(lines):
              line = lines[i]
              stripped = line.rstrip('\n')
              if stripped in ('packages:', 'snapshots:'):
                  current = stripped[:-1]
                  out.append(line)
                  i += 1
                  continue
              if line and not line.startswith(' ') and stripped.endswith(':'):
                  current = None

              if current and line.startswith('  ') and not line.startswith('    ') and stripped.endswith(':'):
                  key = stripped[2:-1]
                  start = i
                  i += 1
                  while i < len(lines):
                      candidate = lines[i]
                      candidate_stripped = candidate.rstrip('\n')
                      if candidate_stripped in ('packages:', 'snapshots:'):
                          break
                      if candidate and not candidate.startswith(' '):
                          break
                      if candidate.startswith('  ') and not candidate.startswith('    ') and candidate_stripped.endswith(':'):
                          break
                      i += 1
                  block = lines[start:i]
                  if key in seen[current]:
                      duplicates.append((current, key))
                      continue
                  seen[current].add(key)
                  out.extend(block)
                  continue

              out.append(line)
              i += 1

          expected = [('packages', 'postcss@8.5.28'), ('snapshots', 'postcss@8.5.28')]
          if duplicates != expected:
              raise SystemExit(f'Unexpected duplicate mappings: {duplicates!r}; expected {expected!r}')

          path.write_text(''.join(out))
          PY

      - name: Validate frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Commit minimal repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: remove duplicate pnpm lock mappings"
          git push origin HEAD:fix/repair-pnpm-lockfile
