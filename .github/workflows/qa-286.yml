name: QA 286 reconciliation

on:
  push:
    branches:
      - feature/286-reconciliation-ui-undo

permissions:
  contents: read

concurrency:
  group: qa-286-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_gastos_qa_286
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_gastos_qa_286"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_qa_286
      JWT_SECRET: qa-286-reconciliation-placeholder-secret-with-sufficient-length
      RESEND_API_KEY: re_qa_286_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:5100
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:deps
      - run: pnpm exec prisma migrate deploy
      - run: pnpm build
      - run: pnpm check:frontend-budget
      - run: pnpm --dir tests/e2e --ignore-workspace exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --dir tests/e2e --ignore-workspace exec playwright test reconciliation-flow.spec.mjs --config=../../playwright.config.mjs --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-286-${{ matrix.browser }}
          path: |
            qa-evidence
            tests/e2e/qa-evidence
            playwright-report
            test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
