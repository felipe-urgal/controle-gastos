name: Temporary README main protection sync

on:
  push:
    branches:
      - docs/sync-readme-after-main-protection-241

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update README status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = '''### Pendências abertas

          - #133 — DX/CI avançado: resta apenas avaliar/aplicar administrativamente a proteção da `main`; política de dependências e auditoria já foi entregue no PR #208;
          - #148 — smoke PWA **manual** em dispositivo/navegador real;
          - #137 — roadmap histórico, mantido aberto enquanto #133 e #148 tiverem pendências.

          Também em 2026-09-02, a #230 foi concluída no PR #235 e a #231 no PR #238.
          '''
          new = '''### Pendências abertas

          - #148 — smoke PWA **manual** em dispositivo/navegador real;
          - #137 — roadmap histórico, mantido aberto enquanto #148 estiver pendente.

          Também em 2026-09-02, a #133 foi concluída com a proteção administrativa da `main` ativa; a #230 foi concluída no PR #235 e a #231 no PR #238.
          '''
          if old not in text:
              raise SystemExit('Bloco esperado não encontrado no README')
          if text.count(old) != 1:
              raise SystemExit('Bloco esperado não é único no README')
          path.write_text(text.replace(old, new))
          PY

      - name: Validate documentation diff
        shell: bash
        run: |
          git diff --check
          git diff -- README.md
          grep -F -- '- #148 — smoke PWA **manual** em dispositivo/navegador real;' README.md
          grep -F -- '- #137 — roadmap histórico, mantido aberto enquanto #148 estiver pendente.' README.md
          grep -F -- 'a #133 foi concluída com a proteção administrativa da `main` ativa' README.md
          ! grep -F -- '#133 — DX/CI avançado: resta apenas avaliar/aplicar administrativamente' README.md

      - name: Commit documentation sync and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-readme-main-protection.yml
          git add README.md
          git commit -m 'docs: sync README after main protection'
          git push
