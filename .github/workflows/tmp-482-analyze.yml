name: Temp #482 analyzer

on:
  push:
    branches:
      - perf/turbopack-analyzer-482

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_analyze
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Analyze bundle
        run: pnpm analyze

      - name: Inspect output
        run: find .next/diagnostics/analyze -maxdepth 2 -type f -print | head -50

      - name: Upload analyzer output
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analyzer-482
          path: .next/diagnostics/analyze
          retention-days: 7
