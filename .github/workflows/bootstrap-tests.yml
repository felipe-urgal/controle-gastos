name: Temporary test bootstrap validation

on:
  push:
    branches:
      - test/quality-gates

permissions:
  contents: write

jobs:
  bootstrap-and-validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/database
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Add Vitest and update lockfile
        run: pnpm add -D vitest@4.1.11 --lockfile-only

      - name: Commit dependency metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Dependency metadata already current."
            exit 0
          fi
          git commit -m "test: add Vitest dependency"
          git push

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
