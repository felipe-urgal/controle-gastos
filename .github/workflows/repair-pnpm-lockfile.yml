name: Repair pnpm lockfile

on:
  push:
    branches:
      - fix/repair-pnpm-lockfile

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/repair-pnpm-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate

      - name: Regenerate lockfile from package.json
        run: |
          rm pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already consistent"
            exit 0
          fi
          git commit -m "fix: regenerate pnpm lockfile"
          git push origin HEAD:fix/repair-pnpm-lockfile
