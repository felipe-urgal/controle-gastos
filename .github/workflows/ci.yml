name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: controle_gastos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d controle_gastos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECK_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_test
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:5100
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production check
        run: pnpm prod:check
