name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_test
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: no-reply@example.test
      NEXT_PUBLIC_SITE_URL: http://localhost:5100
      NODE_OPTIONS: --trace-deprecation
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_test
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: no-reply@example.test
      NEXT_PUBLIC_SITE_URL: http://localhost:5100
      NODE_OPTIONS: --trace-deprecation
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test --shard=${{ matrix.shard }}/2

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_gastos_test
      JWT_SECRET: ci-only-placeholder-secret-with-sufficient-length
      TOTP_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: no-reply@example.test
      NEXT_PUBLIC_SITE_URL: http://localhost:5100
      NODE_OPTIONS: --trace-deprecation
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  # Check obrigatório no ruleset da main: só passa se todos os jobs acima passarem.
  quality:
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify results
        run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
